name: telegram_image_cropper
description: "Vendored & patched copy of telegram_image_cropper: accepts in-memory image bytes and returns cropped result via callback."
version: 1.0.2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.9.1
  web: ^1.1.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0