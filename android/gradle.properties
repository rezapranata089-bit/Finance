org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
# Menurunkan Xmx dari 8G ke 4G karena runner GitHub Actions standar hanya
# punya ~7GB RAM total; heap 8G bisa memicu swapping yang justru
# memperlambat build. Tambahan flag di bawah mempercepat build lokal & CI
# dengan mengaktifkan paralelisme dan build cache Gradle.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=true
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true
