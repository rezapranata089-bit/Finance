name: my_finance
description: Aplikasi catatan keuangan personal offline-first.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  solar_icons: ^0.1.0
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  fl_chart: ^0.69.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  lottie: ^3.1.2
  number_flow_flutter: ^0.1.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/ai.json
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi_light.otf
          weight: 300
        - asset: assets/fonts/satoshi_regular.otf
          weight: 400
        - asset: assets/fonts/satoshi_medium.otf
          weight: 500
        - asset: assets/fonts/satoshi_medium.otf
          weight: 600
        - asset: assets/fonts/satoshi_bold.otf
          weight: 700
        - asset: assets/fonts/satoshi_bold.otf
          weight: 800
        - asset: assets/fonts/satoshi_black.otf
          weight: 900
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm_serif_display_regular.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/playfairdisplay_regular.ttf
